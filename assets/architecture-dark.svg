<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 320 566" width="320" height="566" role="img" aria-label="Tiny GPT decoder-only transformer architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#556C8C"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: 'Manrope', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #edf1f7; }
    .norm { font-family: 'Manrope', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #8a96a8; }
    .hi { font-family: 'Manrope', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #edf1f7; }
    .strong { font-family: 'Manrope', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0d1117; }
    .ghost { font-family: 'Manrope', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 500; fill: #8a96a8; }
    .caption { font-family: 'IBM Plex Mono', SFMono-Regular, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; fill: #8a96a8; }
    .nx { font-family: 'IBM Plex Mono', SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #7eb3d9; }
    .plus { font-family: 'Manrope', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #7eb3d9; }
    .spine { stroke: #556C8C; stroke-width: 1.6; }
    .residual { fill: none; stroke: #556C8C; stroke-width: 1.4; stroke-linejoin: round; }
  </style>

  <text x="160" y="2" text-anchor="middle" class="caption">Output Probabilities</text>

  <line x1="160" y1="30" x2="160" y2="14" class="spine" marker-end="url(#arrow)"/>
  <line x1="160" y1="90" x2="160" y2="68" class="spine"/>
  <line x1="160" y1="150" x2="160" y2="128" class="spine"/>
  <line x1="160" y1="224" x2="160" y2="184" class="spine"/>
  <line x1="160" y1="272" x2="160" y2="256" class="spine"/>
  <line x1="160" y1="328" x2="160" y2="312" class="spine"/>
  <line x1="160" y1="374" x2="160" y2="360" class="spine"/>
  <line x1="160" y1="438" x2="160" y2="408" class="spine"/>
  <line x1="160" y1="494" x2="160" y2="466" class="spine"/>

  <rect x="70" y="30" width="180" height="38" rx="19" fill="#1C2630" stroke="#7eb3d9" stroke-width="1.3"/>
  <text x="160" y="54" text-anchor="middle" class="lbl">Softmax</text>

  <rect x="70" y="90" width="180" height="38" rx="19" fill="#2F281B" stroke="#e0a030" stroke-width="1.3"/>
  <text x="160" y="114" text-anchor="middle" class="hi">Linear</text>

  <rect x="58" y="150" width="204" height="34" rx="7" fill="#0d1117" stroke="#3F5161" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="160" y="172" text-anchor="middle" class="norm">Layer Norm</text>

  <rect x="24" y="208" width="248" height="216" rx="10" fill="#12181F" stroke="#43586A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="292" y="316" text-anchor="middle" class="nx" transform="rotate(90 292 316)">&#215; 5</text>

  <path d="M 160 320 H 36 V 240 H 58" class="residual" marker-end="url(#arrow)"/>
  <path d="M 160 418 H 36 V 344 H 58" class="residual" marker-end="url(#arrow)"/>

  <rect x="58" y="224" width="204" height="32" rx="7" fill="#0d1117" stroke="#3F5161" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="160" y="245" text-anchor="middle" class="norm">Add &amp; Norm</text>

  <rect x="58" y="272" width="204" height="40" rx="7" fill="#2F281B" stroke="#e0a030" stroke-width="1.3"/>
  <text x="160" y="297" text-anchor="middle" class="hi">Feed Forward</text>

  <rect x="58" y="328" width="204" height="32" rx="7" fill="#0d1117" stroke="#3F5161" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="160" y="349" text-anchor="middle" class="norm">Add &amp; Norm</text>

  <rect x="46" y="374" width="228" height="34" rx="8" fill="#7eb3d9" stroke="#7eb3d9" stroke-width="1.3"/>
  <text x="160" y="396" text-anchor="middle" class="strong">Masked Multi-Head Attention</text>

  <circle cx="160" cy="452" r="14" fill="#0d1117" stroke="#7eb3d9" stroke-width="1.6"/>
  <text x="160" y="457" text-anchor="middle" class="plus">+</text>
  <rect x="10" y="436" width="120" height="32" rx="7" fill="none" stroke="#43586A" stroke-width="1.3"/>
  <text x="70" y="456" text-anchor="middle" class="ghost">Positional Encoding</text>
  <line x1="130" y1="452" x2="146" y2="452" class="spine"/>

  <rect x="58" y="494" width="204" height="40" rx="7" fill="#1C2630" stroke="#556C8C" stroke-width="1.3"/>
  <text x="160" y="519" text-anchor="middle" class="lbl">Input Embedding</text>
</svg>
